<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация ЭЦП | AI Lawyer KZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --error: #ef4444;
            --success: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            margin: 0 0 12px 0;
            font-size: 24px;
            font-weight: 600;
        }

        .header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
        }
        
        input[type="file"]::file-selector-button {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            padding: 8px 12px;
            margin-right: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background: rgba(255,255,255,0.2);
        }

        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="password"]:focus {
            border-color: var(--primary);
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 24px;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .checkbox-group input[type="checkbox"] {
            margin-top: 3px;
            accent-color: var(--primary);
        }
        
        .checkbox-group a {
            color: var(--primary);
            text-decoration: none;
        }
        
        .checkbox-group a:hover {
            text-decoration: underline;
        }

        .btn-connect {
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-connect:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }
        
        .btn-connect:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status-box {
            margin-top: 24px;
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            display: none;
            line-height: 1.5;
            word-break: break-all;
        }

        .status-box.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--error);
        }

        .status-box.success {
            display: block;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--success);
        }
        
        .token-display {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            font-family: monospace;
            font-size: 16px;
            text-align: center;
            letter-spacing: 1px;
            border: 1px dashed var(--success);
            cursor: pointer;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: rgba(148, 163, 184, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="header">
                <h1>AI Lawyer KZ</h1>
                <p>Загрузите ваш ключ ЭЦП (AUTH_RSA) для доступа к базе судебных актов</p>
            </div>

            <form id="uploadForm">
                <div class="form-group">
                    <label for="ecpFile">Файл ключа (.p12)</label>
                    <input type="file" id="ecpFile" accept=".p12" required>
                </div>

                <div class="form-group">
                    <label for="ecpPassword">Пароль от ключа</label>
                    <input type="password" id="ecpPassword" placeholder="Введите пароль..." required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="consentCheck" required>
                    <label for="consentCheck">
                        Я даю согласие на временную передачу ключа ЭЦП для автоматизированного доступа к порталу электронного правосудия. Ключ не сохраняется и удаляется сразу после поиска. Подробнее в <a href="privacy.html" target="_blank">Политике конфиденциальности</a>.
                    </label>
                </div>

                <button type="submit" id="submitBtn" class="btn-connect">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    Авторизоваться
                </button>
            </form>

            <div id="statusBox" class="status-box"></div>
        </div>

        <div class="footer">
            Безопасное соединение • Не храним ключи
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusBox = document.getElementById('statusBox');

        function showStatus(type, message, token = null) {
            statusBox.className = 'status-box ' + type;
            if (type === 'success' && token) {
                statusBox.innerHTML = `
                    <strong>Успешно!</strong> ${message}<br>
                    Ваш токен сессии (нажмите чтобы скопировать):
                    <div class="token-display" onclick="copyToken('${token}')">${token}</div>
                    <div style="margin-top:8px; font-size:12px; color:var(--text-muted)">
                    Скопируйте этот токен и отправьте боту в чат.
                    </div>
                `;
            } else {
                statusBox.textContent = message;
            }
        }

        window.copyToken = function(token) {
            navigator.clipboard.writeText(token).then(() => {
                alert('Токен скопирован в буфер обмена!');
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById('ecpFile');
            const passwordInput = document.getElementById('ecpPassword');
            const consentCheck = document.getElementById('consentCheck');

            if (!fileInput.files.length) {
                showStatus('error', 'Выберите файл .p12');
                return;
            }

            if (!consentCheck.checked) {
                showStatus('error', 'Необходимо подтвердить согласие');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Загрузка...';
            statusBox.style.display = 'none';

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('password', passwordInput.value);

            try {
                // ВАЖНО: Укажите здесь реальный IP/домен VPS
                const response = await fetch('/api/v1/auth/upload_ecp', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showStatus('success', 'Файл загружен и зашифрован.', data.session_token);
                    form.reset();
                } else {
                    showStatus('error', data.detail || data.message || 'Ошибка загрузки');
                }
            } catch (err) {
                showStatus('error', 'Ошибка соединения с сервером. Проверьте сеть.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Авторизоваться';
            }
        });
    </script>
</body>
</html>
