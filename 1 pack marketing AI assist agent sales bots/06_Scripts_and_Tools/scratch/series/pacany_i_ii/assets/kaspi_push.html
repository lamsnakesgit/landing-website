<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaspi Push Overlay</title>
    <style>
        body {
            background-color: transparent;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding-top: 50px;
        }

        .push-container {
            width: 350px;
            background: rgba(30, 30, 30, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 12px 16px;
            display: flex;
            align-items: flex-start;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            margin-bottom: 12px;
            
            opacity: 0;
            transform: translateY(-20px) scale(0.95);
            animation: slideDown 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .push-1 { animation-delay: 0.5s; }
        .push-2 { animation-delay: 1.2s; }
        .push-3 { animation-delay: 1.8s; }

        @keyframes slideDown {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .icon {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            background-color: #F14635;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 18px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .app-name {
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .time {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }

        .title {
            color: white;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .message {
            color: rgba(255, 255, 255, 0.9);
            font-size: 15px;
            line-height: 1.3;
        }

        .amount {
            color: #2ECC71;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="push-container push-1">
        <div class="icon">K</div>
        <div class="content">
            <div class="header">
                <span class="app-name">Kaspi.kz</span>
                <span class="time">Только что</span>
            </div>
            <div class="title">Перевод</div>
            <div class="message">Поступление <span class="amount">+50 000 ₸</span> от Руслан Т.</div>
        </div>
    </div>

    <div class="push-container push-2">
        <div class="icon">K</div>
        <div class="content">
            <div class="header">
                <span class="app-name">Kaspi.kz</span>
                <span class="time">Только что</span>
            </div>
            <div class="title">Перевод</div>
            <div class="message">Поступление <span class="amount">+100 000 ₸</span> от Айгерим С.</div>
        </div>
    </div>

</body>
</html>
