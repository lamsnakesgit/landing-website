<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone Lockscreen Mockup</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #iphone-screen {
      width: 440px;
      height: 950px;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      border-radius: 40px;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      box-sizing: border-box;
      padding: 40px 20px 20px 20px; /* Увеличили верхний отступ для safe area */
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Статус-бар */
    .status-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      color: white;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 20px;
      box-sizing: border-box;
    }

    /* Часы на экране блокировки */
    .lockscreen-time {
      color: rgba(255, 255, 255, 0.9);
      font-size: 80px;
      font-weight: 200;
      margin-top: 40px;
      letter-spacing: -2px;
    }

    .lockscreen-date {
      color: rgba(255, 255, 255, 0.9);
      font-size: 20px;
      font-weight: 400;
      margin-top: -10px;
      margin-bottom: 50px;
    }

    /* Контейнер уведомлений */
    .notifications-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-sizing: border-box;
      padding: 0 10px;
    }

    /* Стиль нативного пуша iOS (матовое стекло) */
    .ios-notification {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 18px;
      padding: 14px 16px;
      color: white;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .notif-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 500;
    }

    .app-icon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background-size: cover;
      background-position: center;
    }

    /* Иконка Kaspi */
    .app-icon.kaspi {
      background-color: #d41224;
      background-image: radial-gradient(circle, #f01428 30%, #b00f1c 90%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 900;
      font-size: 11px;
      font-family: Arial, sans-serif;
    }

    /* Иконка Telegram */
    .app-icon.telegram {
      background-color: #24A1DE;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .app-icon.telegram svg {
      width: 14px;
      height: 14px;
      fill: white;
    }

    .app-name {
      font-weight: 600;
      color: rgba(255, 255, 255, 0.95);
    }

    .notif-time {
      margin-left: auto;
    }

    .notif-title {
      font-size: 15px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.95);
    }

    .notif-body {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.3;
    }

    /* Водяной знак */
    .watermark {
      position: absolute;
      bottom: 40px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div id="iphone-screen">
    <!-- Статус-бар -->
    <div class="status-bar">
      <span>18:54</span>
      <div style="display: flex; gap: 5px; align-items: center;">
        <span>5G</span>
        <div style="width: 20px; height: 10px; border: 1px solid white; border-radius: 2px; padding: 1px; display:flex;"><div style="width: 100%; height: 100%; background: white;"></div></div>
      </div>
    </div>

    <!-- Время и дата -->
    <div class="lockscreen-time">18:54</div>
    <div class="lockscreen-date">Понедельник, 25 мая</div>

    <!-- Уведомления -->
    <div class="notifications-container">
      
      <!-- Пуш Kaspi -->
      <div class="ios-notification">
        <div class="notif-header">
          <div class="app-icon kaspi">K</div>
          <span class="app-name">Kaspi.kz</span>
          <span class="notif-time">сейчас</span>
        </div>
        <div class="notif-title">Перевод</div>
        <div class="notif-body">Вам поступил перевод 1 500 000 ₸ от Баке</div>
      </div>

      <!-- Пуш Telegram -->
      <div class="ios-notification">
        <div class="notif-header">
          <div class="app-icon telegram">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.24-5.54 3.65-.52.36-.99.54-1.41.53-.46-.01-1.34-.26-2-.48-.8-.27-1.44-.42-1.39-.89.03-.25.38-.51 1.07-.78 4.2-1.83 7-3.04 8.4-3.63 4-.17 4.83.69 4.84.88z"/></svg>
          </div>
          <span class="app-name">Telegram</span>
          <span class="notif-time">сейчас</span>
        </div>
        <div class="notif-title">Баке</div>
        <div class="notif-body">Мансик, твой бот выбил долг! Подключи мне автообзвон. Но наш сервер взломали...</div>
      </div>

    </div>

    <!-- Водяной знак -->
    <div class="watermark">@aiconicvibe</div>
  </div>

</body>
</html>
